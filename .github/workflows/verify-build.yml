name: verify-build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream tag to patch, test, build and publish (blank = latest)'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
jobs:
  build:
    uses: ./.github/workflows/auto-build.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
